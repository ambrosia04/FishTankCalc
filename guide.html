<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Icon.png">
    <style>
        .guide-container {
            padding: 40px;
            max-width: 1400px;
            margin: auto;
        }

        /* Widened for 5-column layout */

        .fish-section {
            margin-bottom: 80px;
        }

        .fish-title {
            color: #27ae60;
            font-size: 2.8rem;
            margin-bottom: 25px;
            border-bottom: 3px solid #8e44ad;
            display: block;
            padding-bottom: 10px;
            width: 100%;
        }

        /* The Flexible Grid with 5-column limit */
        .photo-grid {
            display: grid;
            /* On mobile/tablet, it fits as many as possible (min 200px) */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            align-items: start;
        }

        /* On desktop screens, force a maximum of 5 columns */
        @media (min-width: 1100px) {
            .photo-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .guide-card {
            background: #132938;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: zoom-in;
            height: 100%;
            /* Ensures cards stay aligned */
        }

        .guide-card:hover {
            transform: scale(1.05);
            border-color: #1e90ff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .guide-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Lightbox/Zoom View */
        #zoomView {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
        }

        #zoomView img {
            max-width: 95vw;
            max-height: 95vh;
            border: 2px solid #1e90ff;
            border-radius: 8px;
        }

        .back-row {
            margin-bottom: 30px;
        }

        .main-page-title {
            color: #1e90ff;
            text-align: center;
            margin-bottom: 60px;
            font-size: 3rem;
        }
    </style>
</head>
