<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Care Guides</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Icon.png">
    <style>
        .guide-container { padding: 40px; max-width: 1100px; margin: auto; }
        
        .fish-section {
            margin-bottom: 80px; /* Spacing between different fish types */
        }

        .fish-title {
            color: #27ae60;
            font-size: 2.8rem; /* Much bigger title */
            margin-bottom: 25px;
            border-bottom: 3px solid #8e44ad; /* Purple line */
            display: block; /* Makes the line span the width */
            padding-bottom: 10px;
            width: 100%; /* Long line */
        }

        /* The Flexible Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            align-items: start;
        }

        .guide-card {
            background: #132938;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: zoom-in;
        }

        .guide-card:hover {
            transform: scale(1.03);
            border-color: #1e90ff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .guide-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Lightbox/Zoom View */
        #zoomView {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
        }
        #zoomView img {
            max-width: 95vw;
            max-height: 95vh;
            border: 2px solid #1e90ff;
            border-radius: 8px;
        }

        .back-row { margin-bottom: 30px; }
        
        /* Main Page Title */
        .main-page-title {
            color: #1e90ff; /* Blue like other pages */
            text-align: center;
            margin-bottom: 60px;
            font-size: 3rem;
        }
    </style>
</head>
<body>

<div class="guide-container">
    <div class="back-row">
        <a href="Tips.html" class="btn-nav">← Back to Tips</a>
    </div>

    <h1 class="main-page-title">Fish Care Visual Guides</h1>

    <!-- SECTION: BETTA -->
    <section class="fish-section">
        <h2 class="fish-title">Betta Fish</h2>
        <div class="photo-grid">
            <div class="guide-card">
                <img src="Guides/bettaGuide.png" alt="Betta Care Guide" onerror="this.src='Icon.png'">
            </div>
            <!-- Add more <img> here if needed -->
        </div>
    </section>

    <!-- SECTION: GOLDFISH -->
    <section class="fish-section">
        <h2 class="fish-title">Goldfish</h2>
        <div class="photo-grid">
            <div class="guide-card">
                <img src="Guides/goldfishCare.png" alt="Goldfish Care Guide" onerror="this.src='Icon.png'">
            </div>
        </div>
    </section>

    <!-- To add a new fish: 
    Copy from <section> to </section> and change the title and image path. -->

</div>

<!-- Zoom View Overlay -->
<div id="zoomView" onclick="this.style.display='none'">
    <img id="zoomImg" alt="zoom" src="">
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const zoomView = document.getElementById('zoomView');
        const zoomImg = document.getElementById('zoomImg');
        const images = document.querySelectorAll('.guide-card img');

        images.forEach(img => {
            img.addEventListener('click', () => {
                zoomImg.src = img.src;
                zoomView.style.display = 'flex';
            });
        });
    });
</script>

</body>
</html>
